name: NBA Daily Revenge Update

on:
  schedule:
    - cron: '0 5 * * *'    # 05:00 UTC daily: 1am EDT, midnight EST after Nov 1
  workflow_dispatch:        # Manual trigger for testing

jobs:
  nba-daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run full NBA daily update via Claude
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,WebSearch,WebFetch
          prompt: |
            You are running the nightly NBA revenge update for VengeStats. Read CLAUDE.md first
            (Departure Methods, Common Gotchas, Tweet Format). DATABASE_URL points at the production
            Railway database; it is the only database in this environment, so every write is live.
            Never write a departure method you have not verified with a web search. Leave it NULL
            and list it in the report instead.

            1. AUDIT
               cd backend && python -m scripts.nba_audit
               This prints tonight's slate, a roster check of every team playing tonight against
               ESPN, and the full stint history of every revenge player with "!!" flags.
               If it prints "NO NBA GAMES", skip to step 5 and write "NO TWEET TODAY".

            2. FIX ROSTER ISSUES (tonight's teams only)
               - WRONG CURRENT TEAM: research the move. Set nba_players.current_team_id to the ESPN
                 team and prev_team_id to the team they left. Set departure_method on the stint for
                 the team they left. Insert a stint for the new team (first_game_date = the
                 transaction date, games_played 0, is_current TRUE) and set every other stint for
                 that player to is_current FALSE.
               - DUPLICATE ROWS: the same person exists twice (usually an accent difference). Keep the
                 row with stint history, repoint any rows in nba_player_team_stints_api,
                 nba_player_team_stints, nba_player_team_history and nba_first_revenge_games to it,
                 copy over the correct current_team_id, then delete the empty duplicate.
               - MISSING FROM DB / NOT ON ESPN ROSTER: list them in the report; only act if the
                 player would create or remove a revenge game tonight.

            3. FIX EVERY REVENGE PLAYER HISTORY
               Re-run the audit after step 2 (new revenge players may appear). For every revenge
               player, the whole career must match real life, not just the stint vs tonight's opponent:
               - every former-team stint gets a verified departure_method:
                 'Traded', 'Released' (also use for waived/bought out) or 'Free Agent'
                 (contract expired, option declined, signed elsewhere)
               - exactly one is_current stint, and it is the current team
               - offseason moves with no games yet still need a stint (games_played 0)
               - prev_team_id = the most recent former team
               - delete placeholder duplicates (same team, 0 games, overlapping a real stint)
               Re-run the audit until no "!!" flags remain except departures you could not verify.

            4. REFRESH PRODUCTION CACHE
               curl -s -X POST https://vengestats-production.up.railway.app/cron/refresh-cache/$CACHE_KEY
               Then curl https://vengestats-production.up.railway.app/matchups and confirm the NBA list
               reflects your fixes.

            5. WRITE THE REPORT AND TWEET
               /tmp/nba_report.md: tonight's slate, every DB change you made (player, what changed,
               source), anything you could not verify, and the final revenge list with VengeScores.
               /tmp/nba_day_tweet.txt: the tweet per CLAUDE.md "NBA Nightly Revenge Tweet"
               (top 2 by VengeScore, only if the top score is at least 6.0; [F/A], [Traded], [Released];
               team nicknames only; one tagline; no em dashes). Otherwise write "NO TWEET TODAY".
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          CACHE_KEY: ${{ secrets.CACHE_KEY }}

      - name: Refresh and verify production cache
        if: always()
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
        run: |
          API=https://vengestats-production.up.railway.app
          TODAY=$(TZ=America/New_York date +%F)
          slate() { curl -s --max-time 600 "$API/matchups" | python3 -c "import json,sys; print(json.load(sys.stdin).get('nba_slate_date'))"; }
          if [ "$(slate)" != "$TODAY" ]; then
            curl -s --fail --max-time 600 -X POST "$API/cron/refresh-cache/$CACHE_KEY"
            echo
          fi
          SLATE=$(slate)
          echo "nba_slate_date=$SLATE, expected $TODAY"
          [ "$SLATE" = "$TODAY" ] || { echo "::error::Production cache is not on today's slate"; exit 1; }

      - name: Post tweet draft to job summary
        if: always()
        run: |
          echo "## NBA Tweet Draft" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/nba_day_tweet.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/nba_day_tweet.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_Tweet file not generated. Check the Claude step logs._" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          [ -f /tmp/nba_report.md ] && cat /tmp/nba_report.md >> $GITHUB_STEP_SUMMARY || true

      - name: Build email body
        if: always()
        run: |
          {
            echo "NBA nightly update: ${{ job.status }}"
            echo ""
            echo "TWEET DRAFT"
            echo "-----------"
            cat /tmp/nba_day_tweet.txt 2>/dev/null || echo "(no tweet file generated)"
            echo ""
            echo "REPORT"
            echo "------"
            cat /tmp/nba_report.md 2>/dev/null || echo "(no report generated)"
            echo ""
            echo "Full run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/nba_email.txt

      - name: Send summary email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "VengeStats NBA nightly update: ${{ job.status }}"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: file:///tmp/nba_email.txt
