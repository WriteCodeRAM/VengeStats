name: Refresh VengeStats Cache
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh cache
        run: curl -X POST "${{ secrets.VENGESTATS_CRON_URL }}"

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "VengeStats updated successfully!"
          to: your@email.com
          from: your@email.com
          body: "Nightly cache refresh completed successfully."

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "VengeStats cache refresh FAILED"
          to: your@email.com
          from: your@email.com
          body: "Nightly cache refresh failed. Check Actions logs."
